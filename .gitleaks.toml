# Secret scanning (ci.yml). Fixtures hold made-up ids, hashes and tokens; nothing real is ever committed.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures with deliberately fake identifiers"
paths = [
  '''packages/protocol/examples/.*''',
  '''packages/test-vectors/thulla/V-.*\.json''',
  '''packages/shared-ts/src/__tests__/fixtures/.*''',
  # Generated string tables: "key" fields hold string ids like ui.waiting4_rematch, not secrets.
  '''apps/unity/Hulla/Assets/_Project/Localization/Resources/Strings/.*\.json''',
  '''packages/strings/generated/.*\.json''',
]

# Meta's client token goes into its settings asset and the Android manifest only during a build (SocialSetup).
[[rules]]
id = "facebook-client-token"
description = "Facebook client token left in Meta's settings asset or the Android manifest"
regex = '''(?:com\.facebook\.sdk\.ClientToken" android:value="|clientTokens:\s*-\s*)([0-9a-f]{32})'''
