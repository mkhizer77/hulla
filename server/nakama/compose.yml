# Local development stack: Postgres, Nakama with the bundle mounted as a module. docker compose up.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  nakama:
    image: ${NAKAMA_IMAGE:-heroiclabs/nakama:3.41.0}
    entrypoint:
      - /bin/sh
      - -ecx
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/config/local.yml
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./build:/nakama/data/modules:ro
      - ./config:/nakama/data/config:ro
    # Loopback by default; HULLA_BIND=0.0.0.0 opens the ports to the LAN for phones on the same Wi-Fi.
    ports:
      - "${HULLA_BIND:-127.0.0.1}:7350:7350"
      - "${HULLA_BIND:-127.0.0.1}:7351:7351"
      - "127.0.0.1:9100:9100"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
