# Nakama configuration for local development and the phase 0 box. Secrets below are placeholders for
# local use only; every deployed box replaces them before the first start (runbook, "Hardening the box").
name: hulla-local
data_dir: /nakama/data
logger:
  level: INFO
  stdout: true
database:
  address:
    - postgres:localdb@postgres:5432/nakama
console:
  port: 7351
  username: admin
  password: local-only-password
socket:
  port: 7350
  server_key: local-only-server-key
  max_message_size_bytes: 32768
  ping_period_ms: 15000
  pong_wait_ms: 25000
session:
  token_expiry_sec: 7200
  refresh_token_expiry_sec: 2592000
runtime:
  http_key: local-only-http-key
  js_entrypoint: index.js
  # Read by the modules through ctx.env; deployed boxes set real values (never in the repository).
  env:
    - "HULLA_ENV=local"
    - "HULLA_REGION=local"
    # Turn timer in seconds for every mode while play-testing (5 to 120); empty keeps the GDD defaults (R43).
    - "HULLA_TURN_SECONDS="
    - "AGORA_APP_ID="
    - "AGORA_APP_CERTIFICATE="
    # Owner accounts allowed to call the admin RPCs with a session (comma-separated user ids); the server key always may.
    - "HULLA_ADMIN_USER_IDS="
    # Signature of content/manifest.json from `pnpm content:sign <key.pem>` at deploy time (the private
    # key stays off the box); empty on a development box means unsigned.
    - "HULLA_CONTENT_SIGNATURE="
    - "HULLA_CONTENT_SIGNING_KEY_ID="
    # Firebase Cloud Messaging HTTP v1 (GDD 10.10): the service account's project id, client email and
    # private key (PEM, newlines as \n). All three empty means no push; in-app notifications still flow.
    - "HULLA_FCM_PROJECT_ID="
    - "HULLA_FCM_CLIENT_EMAIL="
    - "HULLA_FCM_PRIVATE_KEY="
    # AppLovin MAX event key (Account > General > Keys): checks the token on rewarded callbacks (GDD 13.6).
    - "HULLA_APPLOVIN_EVENT_KEY="
# Store receipt validation (GDD 20.9): Apple's app-specific shared secret and the Google service
# account with Play Developer API access; empty on a development box, so iap_verify answers
# economy.store_unavailable (docs/runbooks/push-and-purchases-setup.md).
iap:
  apple:
    shared_password: ""
  google:
    client_email: ""
    private_key: ""
# Prometheus metrics for infra/observability (docs/runbooks/observability.md).
metrics:
  prometheus_port: 9100
match:
  input_queue_size: 128
  call_queue_size: 128
# Groups form every 5 s at the requested size; the fourth pass (20 s) accepts the minimum of three (GDD 9.6, OQ-006).
matchmaker:
  interval_sec: 5
  max_intervals: 3
