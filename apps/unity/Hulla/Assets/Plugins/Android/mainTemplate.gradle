    implementation 'com.android.support:cardview-v7:25.3.1' // Facebook.Unity.Editor.AndroidSupportLibraryResolver.addSupportLibraryDependency
    implementation 'com.android.support:customtabs:25.3.1' // Facebook.Unity.Editor.AndroidSupportLibraryResolver.addSupportLibraryDependency
    implementation 'com.android.support:support-v4:25.3.1' // Facebook.Unity.Editor.AndroidSupportLibraryResolver.addSupportLibraryDependency
    implementation 'com.facebook.android:facebook-applinks:[18.3.0,19)' // Assets/FacebookSDK/Plugins/Editor/Dependencies.xml:6
    implementation 'com.facebook.android:facebook-core:[18.3.0,19)' // Assets/FacebookSDK/Plugins/Editor/Dependencies.xml:5
    implementation 'com.facebook.android:facebook-gamingservices:[18.3.0,19)' // Assets/FacebookSDK/Plugins/Editor/Dependencies.xml:9
    implementation 'com.facebook.android:facebook-login:[18.3.0,19)' // Assets/FacebookSDK/Plugins/Editor/Dependencies.xml:7
    implementation 'com.facebook.android:facebook-share:[18.3.0,19)' // Assets/FacebookSDK/Plugins/Editor/Dependencies.xml:8
    implementation 'com.google.android.gms:play-services-base:18.11.1' // Packages/com.google.firebase.app/Firebase/Editor/AppDependencies.xml:16
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1' // Assets/BuildTools/Editor/HullaSocialDependencies.xml:7
    implementation 'com.google.firebase:firebase-analytics:24.0.0' // Packages/com.google.firebase.analytics/Firebase/Editor/AnalyticsDependencies.xml:12
    implementation 'com.google.firebase:firebase-analytics-unity:14.1.0' // Packages/com.google.firebase.analytics/Firebase/Editor/AnalyticsDependencies.xml:17
    implementation 'com.google.firebase:firebase-app-unity:14.1.0' // Packages/com.google.firebase.app/Firebase/Editor/AppDependencies.xml:21
    implementation 'com.google.firebase:firebase-common:23.0.0' // Packages/com.google.firebase.app/Firebase/Editor/AppDependencies.xml:12
    implementation 'com.google.firebase:firebase-crashlytics-ndk:21.0.1' // Packages/com.google.firebase.crashlytics/Firebase/Editor/CrashlyticsDependencies.xml:12
    implementation 'com.google.firebase:firebase-crashlytics-unity:14.1.0' // Packages/com.google.firebase.crashlytics/Firebase/Editor/CrashlyticsDependencies.xml:19
    implementation 'com.google.firebase:firebase-iid:21.1.0' // Packages/com.google.firebase.messaging/Firebase/Editor/MessagingDependencies.xml:16
    implementation 'com.google.firebase:firebase-messaging:26.0.1' // Packages/com.google.firebase.messaging/Firebase/Editor/MessagingDependencies.xml:12
    implementation 'com.google.firebase:firebase-messaging-unity:14.1.0' // Packages/com.google.firebase.messaging/Firebase/Editor/MessagingDependencies.xml:23
    implementation 'com.google.flatbuffers:flatbuffers-java:1.12.0' // Packages/com.google.firebase.messaging/Firebase/Editor/MessagingDependencies.xml:18
