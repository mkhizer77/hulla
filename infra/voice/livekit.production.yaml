# LiveKit on a box (ADR-0024, docs/runbooks/voice-setup.md). Copy to the box, fill the key, the secret
# and the domain there; the secret lives only in the box's secrets file. Audio tables only.
# Signalling (7880) sits behind the box's TLS proxy as wss://voice.<domain>.
port: 7880
rtc:
  # Media: UDP 7882 for almost everyone, TCP 7881 when UDP is blocked, TURN below as the last resort.
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
keys:
  # <key>: <secret of at least 32 characters>; the same pair goes into Nakama's LIVEKIT_API_KEY and LIVEKIT_API_SECRET.
  REPLACE_KEY: REPLACE_SECRET
turn:
  enabled: true
  # A DNS-only record (not proxied) pointing at this box; the certificate must match it.
  domain: turn.REPLACE_DOMAIN
  # 443 gets through the strictest networks; use it when nothing else on the box holds 443.
  tls_port: 5349
  udp_port: 3478
  cert_file: /etc/livekit/turn.crt
  key_file: /etc/livekit/turn.key
room:
  empty_timeout: 60
  departure_timeout: 20
  # Six seats and their spectators.
  max_participants: 12
logging:
  level: info
