# Alert rules for the SLOs of GDD 20.13: 99.5% monthly availability, p95 move round trip under
# 250 ms in region, under 1% of rounds with a server-side error. Alertmanager sends them to the
# owner's phone (alertmanager.yml); what each one means is in docs/runbooks/observability.md.
# Unit tests with induced errors: alerts.test.yml (pnpm observability:check).
groups:
  # Availability from the healthcheck probe, as ratios over the burn-rate windows.
  - name: hulla_availability
    interval: 1m
    rules:
      - record: hulla:availability:ratio_5m
        expr: avg(avg_over_time(probe_success{job="nakama_health"}[5m]))
      - record: hulla:availability:ratio_30m
        expr: avg(avg_over_time(probe_success{job="nakama_health"}[30m]))
      - record: hulla:availability:ratio_1h
        expr: avg(avg_over_time(probe_success{job="nakama_health"}[1h]))
      - record: hulla:availability:ratio_6h
        expr: avg(avg_over_time(probe_success{job="nakama_health"}[6h]))
  - name: hulla_availability_month
    interval: 5m
    rules:
      - record: hulla:availability:ratio_30d
        expr: avg(avg_over_time(probe_success{job="nakama_health"}[30d]))
  - name: hulla_slo
    rules:
      - alert: NakamaUnreachable
        expr: probe_success{job="nakama_health"} == 0 or up{job="nakama_health"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Nakama's healthcheck does not answer"
          description: "Players cannot sign in or play. Start with incident-triage.md, step 1."
      # The 0.5% monthly budget: 14.4 times the allowed rate spends 2% of it in an hour.
      - alert: HullaAvailabilityBurnFast
        expr: hulla:availability:ratio_1h < 0.928 and hulla:availability:ratio_5m < 0.928
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Availability is burning the month's error budget fast"
          description: "More than 7% of healthchecks failed in the last hour and they are still failing."
      # Six times the allowed rate spends 5% of the budget in six hours.
      - alert: HullaAvailabilityBurnSlow
        expr: hulla:availability:ratio_6h < 0.97 and hulla:availability:ratio_30m < 0.97
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Availability is slowly eating the month's error budget"
      - alert: HullaAvailabilityBelowSlo
        expr: hulla:availability:ratio_30d < 0.995
        for: 1h
        labels:
          severity: warn
        annotations:
          summary: "Availability over the last 30 days is below 99.5%"
      # The server's share of a move's round trip. At five ticks a second the wait for the tick
      # alone is up to 200 ms, so above that the handler itself is slow (OQ-047).
      - alert: HullaMoveLatencyHigh
        expr: max(nakama_custom_hulla_move_latency{quantile="0.95"}) > 0.2
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "p95 of a move inside the server is above 200 ms"
          description: "The 250 ms round-trip SLO cannot hold. Check CPU, the database panels and recent deploys."
      - alert: HullaDatabaseSaturated
        expr: max(nakama_db_in_use_conns / (nakama_db_max_open_conns > 0)) > 0.8
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "More than 80% of Nakama's database connections are in use"
      - alert: HullaDatabaseWaits
        expr: sum(rate(nakama_db_total_wait_time_nanos[5m])) / 1e9 > 0.5
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Calls wait for a database connection"
          description: "Half a second of waiting every second. Postgres is slow or the pool is too small."
  - name: hulla
    rules:
      - alert: HullaMessagesDropped
        expr: sum(rate(nakama_custom_hulla_messages_dropped[5m])) > 0.01
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Table messages are being dropped"
          description: "More than one message in a hundred seconds fails inside a match handler."
      - alert: HullaRoundErrorRate
        expr: >
          sum(increase(nakama_custom_hulla_messages_dropped[1h]))
            / clamp_min(sum(increase(nakama_custom_hulla_rounds_started[1h])), 1) > 0.01
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "More than 1% of rounds hit a server-side error"
      - alert: HullaNoRounds
        expr: sum(increase(nakama_custom_hulla_rounds_started[30m])) == 0 and sum(increase(nakama_custom_hulla_tables_created[30m])) > 0
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "Tables are created but no round starts"
      - alert: HullaDisconnectsHigh
        expr: >
          sum(increase(nakama_custom_hulla_disconnects[15m]))
            / clamp_min(sum(increase(nakama_custom_hulla_moves[15m])), 1) > 0.05
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Disconnects run above 5% of moves"
      - alert: HullaRpcErrors
        expr: sum(rate(nakama_Rpc_errors[5m])) / clamp_min(sum(rate(nakama_Rpc_count[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "More than 5% of RPC calls fail"
      - alert: NakamaDown
        expr: up{job="nakama"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Nakama is not answering the metrics scrape"
      - alert: HullaPhoneCodeSpendHigh
        expr: sum(increase(nakama_custom_hulla_otp_cost_microusd[1h])) / 1e6 > 20
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Phone codes cost more than US$20 in the last hour"
          description: "Check the country and channel split on the dashboard; lower otp_daily_budget in remote config to cap it (OQ-041)."
      - alert: HullaPhoneCodesUnanswered
        expr: >
          sum(increase(nakama_custom_hulla_otp_sent[1h])) > 50
            and sum(increase(nakama_custom_hulla_otp_verified[1h]))
              / clamp_min(sum(increase(nakama_custom_hulla_otp_sent[1h])), 1) < 0.3
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "Most phone codes go unanswered: likely SMS pumping"
          description: "Fewer than 30% of codes sent in the last hour were verified. Set otp_daily_budget to 0 to stop sending, then check the countries."
