# Prometheus and Grafana next to the local server stack:
#   docker compose -f server/nakama/compose.yml -f infra/observability/compose.yml up -d
# Grafana answers on http://127.0.0.1:3000 (admin / admin) with the Hulla server dashboard provisioned.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ../../infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ../../infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
