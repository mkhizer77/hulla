# Prometheus, Alertmanager, the healthcheck probe and Grafana next to the server stack, locally and on
# the phase 0 box (docs/runbooks/observability.md):
#   docker compose -f server/nakama/compose.yml -f infra/observability/compose.yml up -d
# Everything listens on loopback only; on the box reach Grafana through an SSH tunnel.
# Locally Grafana answers on http://127.0.0.1:3000 (admin / admin) with the Hulla server dashboard.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 30 days at least: the availability SLO is monthly.
      - --storage.tsdb.retention.time=${HULLA_PROMETHEUS_RETENTION:-35d}
    volumes:
      - ../../infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${HULLA_PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1
    # The webhook URL stays out of the repository: it comes from the environment at start. Unset, the
    # alerts show on Alertmanager's page and in Grafana but reach no phone.
    entrypoint:
      - /bin/sh
      - -ec
      - >
        printf '%s' "$${HULLA_ALERT_WEBHOOK_URL:-http://127.0.0.1:9/no-webhook-set}" > /tmp/alert-webhook-url &&
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
    environment:
      HULLA_ALERT_WEBHOOK_URL: ${HULLA_ALERT_WEBHOOK_URL:-}
    volumes:
      - ../../infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${HULLA_ALERTMANAGER_PORT:-9093}:9093"
    restart: unless-stopped
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ../../infra/observability/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      # The box sets a real password and turns anonymous viewing off (runbook).
      GF_SECURITY_ADMIN_PASSWORD: ${HULLA_GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${HULLA_GRAFANA_ANONYMOUS:-true}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../../infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${HULLA_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
