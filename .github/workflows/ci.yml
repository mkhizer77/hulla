name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect which parts exist
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.check.outputs.typescript }}
      csharp: ${{ steps.check.outputs.csharp }}
      unity: ${{ steps.check.outputs.unity }}
      server: ${{ steps.check.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f pnpm-lock.yaml ]; then ts=true; else ts=false; fi
          if find packages -name '*.csproj' -not -path '*/node_modules/*' 2>/dev/null | grep -q .; then cs=true; else cs=false; fi
          if [ -f apps/unity/Hulla/ProjectSettings/ProjectVersion.txt ]; then unity=true; else unity=false; fi
          if [ -f server/nakama/compose.yml ]; then server=true; else server=false; fi
          printf 'typescript=%s\ncsharp=%s\nunity=%s\nserver=%s\n' "$ts" "$cs" "$unity" "$server" >> "$GITHUB_OUTPUT"
          printf 'typescript=%s csharp=%s unity=%s server=%s\n' "$ts" "$cs" "$unity" "$server"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typescript:
    name: TypeScript packages and server
    needs: detect
    if: needs.detect.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm vectors
      - name: Generated code is up to date
        run: |
          pnpm codegen
          git diff --exit-code -- packages/protocol/generated
      - run: pnpm content:validate
      - run: pnpm build

  server-smoke:
    name: Nakama boots with the bundle and answers hello
    needs: detect
    if: needs.detect.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hulla/server build
      - name: Start Postgres and Nakama
        working-directory: server/nakama
        run: docker compose up -d --wait --wait-timeout 120
      - name: The hello RPC answers
        run: |
          body=$(curl -sf "http://127.0.0.1:7350/v2/rpc/hello?http_key=local-only-http-key")
          echo "$body"
          echo "$body" | jq -r '.payload' | jq -e '.ok == true and .protocolMajor == 1' > /dev/null
      - name: Logs and shutdown
        if: always()
        working-directory: server/nakama
        run: docker compose logs nakama | tail -40; docker compose down -v

  csharp:
    name: C# packages
    needs: detect
    if: needs.detect.outputs.csharp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Format check and tests for every C# project
        run: |
          set -e
          for proj in $(find packages -name '*.csproj' -not -path '*/node_modules/*' | sort); do
            echo "== $proj"
            dotnet format "$proj" --verify-no-changes --no-restore || { dotnet restore "$proj" && dotnet format "$proj" --verify-no-changes; }
            dotnet test "$proj" --configuration Release --nologo
          done

  equivalence:
    name: Cross-engine equivalence (1,000 rounds)
    needs: detect
    if: needs.detect.outputs.typescript == 'true' && needs.detect.outputs.csharp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm equivalence -- --rounds 1000

  unity-tests:
    name: Unity edit-mode tests
    needs: detect
    if: needs.detect.outputs.unity == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # LFS objects are cached so each run does not spend the LFS bandwidth quota again.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - run: git lfs pull
      - uses: actions/cache@v4
        with:
          path: apps/unity/Hulla/Library
          key: library-${{ hashFiles('apps/unity/Hulla/Packages/packages-lock.json') }}
          restore-keys: library-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: apps/unity/Hulla
          unityVersion: 6000.4.9f1
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

  # Single required check for branch protection. Skipped jobs count as passing;
  # any failed job fails this one.
  ci:
    name: ci
    needs: [detect, secrets, typescript, server-smoke, csharp, equivalence, unity-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Show job results
        run: echo '${{ toJSON(needs) }}'
      - name: Fail when any job failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
